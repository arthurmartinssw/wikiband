<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wikiband</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>

<body>
  <header class="topo">
    <div class="topo-conteudo">
      <div>
        <h1 class="brand-loop" aria-label="Wikiband: albums, music, artists, now.">
          <span class="brand-fixed">Wikiband</span>
          <span class="brand-cycle" aria-hidden="true">
            <span>Albums.</span>
            <span>Music.</span>
            <span>Artists.</span>
            <span>Now.</span>
          </span>
        </h1>
        <p>Pesquise bandas e artistas reais, salve favoritos e explore novos sons.</p>
      </div>

      <nav class="menu" aria-label="Menu do usuario"></nav>
    </div>
  </header>

  <section class="search-section">
    <div class="search-modes" aria-label="Tipo de busca">
      <button class="mode-btn active" type="button" data-search-type="album">Álbuns</button>
      <button class="mode-btn" type="button" data-search-type="song">Músicas</button>
      <button class="mode-btn" type="button" data-search-type="artist">Artistas</button>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Digite o nome de uma banda ou artista..." autocomplete="off" />
      <button id="searchButton">Pesquisar</button>
    </div>

    <div class="filters-row">
      <select id="genreFilter">
        <option value="todos">Todos os gêneros</option>
      </select>

      <select id="countryFilter">
        <option value="todos">Todos os países</option>
      </select>

      <select id="decadeFilter">
        <option value="todos">Todas as décadas</option>
      </select>

      <select id="sortSelect">
        <option value="relevance">Relevância</option>
        <option value="recent">Mais recentes</option>
        <option value="oldest">Mais antigos</option>
        <option value="az">A-Z</option>
        <option value="za">Z-A</option>
      </select>

      <label class="toggle-filter">
        <input type="checkbox" id="showAlternativesToggle" />
        <span>Mostrar versões alternativas</span>
      </label>
    </div>

    <p class="status" id="status">Pesquise algo para começar.</p>
  </section>

  <main class="container">
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu" title="Menu">☰</button>

    <section class="painel">
      <div class="painel-header">
        <h2>Resultados</h2>
        <div class="painel-header-actions">
          <button class="mini-btn" id="startRadioResultsButton">Rádio dos resultados</button>
          <button class="mini-btn" id="stopRadioButton">Parar rádio</button>
        </div>
      </div>
      <div class="bands-grid" id="bandsGrid"></div>
    </section>

    <div id="footerNav" class="footer-nav" style="display: none;">
      <div class="footer-nav-content">
        <div class="footer-nav-section">
          <h3>Wikiband</h3>
          <div class="footer-nav-links">
            <a href="/sobre.html">Sobre</a>
            <a href="/sobre.html#contato">Contato</a>
          </div>
        </div>
        <div class="footer-nav-section">
          <h3>Legal</h3>
          <div class="footer-nav-links">
            <a href="/sobre.html#privacidade">Privacidade</a>
            <a href="/sobre.html#termos">Termos de Uso</a>
          </div>
        </div>
      </div>
    </div>

    <aside class="sidebar">
      <section class="painel">
        <div class="painel-header">
          <h2>Descobrir</h2>
          <button class="mini-btn" id="refreshDiscoveryButton">Atualizar</button>
        </div>

        <div class="discovery-panel" id="discoveryPanel">
          <div class="discovery-block">
            <h3>Gêneros</h3>
            <div class="chip-list" id="discoverGenres"></div>
          </div>

          <div class="discovery-block">
            <h3>Países</h3>
            <div class="chip-list" id="discoverCountries"></div>
          </div>

          <div class="discovery-block">
            <h3>Décadas</h3>
            <div class="chip-list" id="discoverDecades"></div>
          </div>
        </div>
      </section>

      <section class="painel">
        <div class="painel-header">
          <h2>Histórico</h2>
          <button class="mini-btn danger" id="clearHistoryButton">Limpar</button>
        </div>
        <div id="historyList" class="lista-lateral"></div>
      </section>

      <section class="painel">
        <div class="painel-header">
          <h2>&Aacute;lbuns favoritos</h2>
          <button class="mini-btn danger" id="clearFavoritesButton">Limpar</button>
        </div>
        <div id="favoritesList" class="lista-lateral"></div>
      </section>

      <section class="painel">
        <div class="painel-header">
          <h2>Bandas favoritas</h2>
          <button class="mini-btn danger" id="clearBandFavoritesButton">Limpar</button>
        </div>
        <div id="bandFavoritesList" class="lista-lateral"></div>
      </section>
    </aside>
  </main>

  <script src="/assets/js/core/preview-player.js"></script>
  <script src="/assets/js/modules/storage.js"></script>
  <script src="/assets/js/modules/auth-ui.js"></script>
  <script src="/assets/js/modules/results.js"></script>
  <script src="/assets/js/modules/links.js"></script>
  <script src="/assets/js/modules/share.js"></script>
  <script src="/assets/js/modules/result-cards.js"></script>
  <script src="/assets/js/modules/sidebar.js"></script>
  <script src="/assets/js/modules/music-assistant.js"></script>
  <script src="/assets/js/pages/home.js"></script>
  <script src="/assets/js/core/pwa.js"></script>
  <script>
    // Mobile sidebar toggle
    const sidebarToggle = document.getElementById("sidebarToggle");
    const sidebar = document.querySelector(".sidebar");

    if (sidebarToggle && sidebar) {
      sidebarToggle.addEventListener("click", () => {
        sidebar.classList.toggle("is-open");
      });

      sidebar.addEventListener("click", (e) => {
        if (e.target === sidebar) {
          sidebar.classList.remove("is-open");
        }
      });

      window.addEventListener("resize", () => {
        if (window.innerWidth > 900) {
          sidebar.classList.remove("is-open");
        }
      });
    }

    // Show footer nav after scrolling
    const footerNav = document.getElementById("footerNav");
    const bandsGrid = document.getElementById("bandsGrid");
    let footerShown = false;

    if (footerNav && bandsGrid) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting && bandsGrid.children.length >= 8 && !footerShown) {
            footerNav.style.display = "block";
            footerShown = true;
          }
        });
      }, { threshold: 0.1 });

      observer.observe(bandsGrid);
    }
  </script>
</body>

</html>
