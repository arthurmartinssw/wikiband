<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wikiband</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <div>
        <h1>Wikiband</h1>
        <p>Pesquise bandas e artistas reais, salve favoritos e explore novos sons.</p>
      </div>

      <nav class="menu">
        <a href="index.html">Início</a>
        <a href="favoritos.html">Favoritos</a>
        <a href="sobre.html">Sobre a Wikiband</a>
      </nav>
    </div>
  </header>

  <section class="search-section">
    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Digite o nome de uma banda ou artista..."
        autocomplete="off"
      />
      <button id="searchButton">Pesquisar</button>
    </div>

    <div class="filters-row">
      <select id="genreFilter">
        <option value="todos">Todos os gêneros</option>
      </select>
    </div>

    <p class="status" id="status">Pesquise algo para começar.</p>
  </section>

  <main class="container">
    <section class="painel">
      <div class="painel-header">
        <h2>Resultados</h2>
      </div>
      <div class="bands-grid" id="bandsGrid"></div>
    </section>

    <aside class="sidebar">
      <section class="painel">
        <div class="painel-header">
          <h2>Histórico</h2>
          <button class="mini-btn danger" id="clearHistoryButton">Limpar</button>
        </div>
        <div id="historyList" class="lista-lateral"></div>
      </section>

      <section class="painel">
        <div class="painel-header">
          <h2>&Aacute;lbuns favoritos</h2>
          <button class="mini-btn danger" id="clearFavoritesButton">Limpar</button>
        </div>
        <div id="favoritesList" class="lista-lateral"></div>
      </section>

      <section class="painel">
        <div class="painel-header">
          <h2>Bandas favoritas</h2>
          <button class="mini-btn danger" id="clearBandFavoritesButton">Limpar</button>
        </div>
        <div id="bandFavoritesList" class="lista-lateral"></div>
      </section>
    </aside>
  </main>

  <script src="preview-player.js"></script>
  <script src="script.js"></script>
</body>
</html>
