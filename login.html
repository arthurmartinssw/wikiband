<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Entrar — Wikiband</title>
  <meta name="description" content="Entre na sua conta Wikiband." />
  <meta name="theme-color" content="#04060c" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script src="/assets/js/core/theme.js"></script>
</head>

<body>
  <header class="site-header" data-page="login"></header>

<main class="auth-page">
    <section class="auth-card glass" aria-labelledby="loginTitle">
      <h1 id="loginTitle">Entrar</h1>
      <p class="auth-subtitle">Sua biblioteca sincroniza em todos os seus dispositivos.</p>

      <form id="loginForm" class="auth-form" action="#" method="post" novalidate>
        <label class="auth-field" for="loginEmail">
          <span>E-mail</span>
          <input id="loginEmail" type="email" name="email" placeholder="voce@exemplo.com" autocomplete="email" maxlength="254" required />
        </label>
        <label class="auth-field" for="loginPassword">
          <span>Senha</span>
          <input id="loginPassword" type="password" name="password" placeholder="••••••••" autocomplete="current-password" maxlength="128" required />
        </label>
        <p id="loginStatus" class="auth-feedback" role="status" aria-live="polite"></p>
        <button id="loginSubmit" class="primary-btn" type="submit">Entrar</button>
        <p class="sign-up">É novo na Wikiband? <a href="/cadastro.html" class="create-account-link">Crie uma conta</a></p>
      </form>
    </section>
  </main>

  <script src="/assets/js/core/preview-player.js"></script>
  <script src="/assets/js/modules/storage.js"></script>
  <script src="/assets/js/modules/site-chrome.js"></script>
  <script src="/assets/js/modules/music-assistant.js"></script>
  <script src="/assets/js/pages/login.js"></script>
  <script src="/assets/js/core/pwa.js"></script>
</body>

</html>
